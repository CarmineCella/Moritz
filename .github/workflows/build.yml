# Builds Moritz and Musil on its own on macOS, Linux and Windows (each on its
# own system, with the same CMake build a user runs), renders every patch on
# each system (tools/test-patches.sh), runs Musil's tests on Musil itself and
# on Musil in Moritz (tools/test-musil.sh), and keeps the downloads as artifacts.
# Pushing a tag v<version> also publishes them as a GitHub release.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Version and cache key
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSION_ARG=-DMORITZ_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi
          echo "deps=$(grep -E 'FLTK_(VERSION|SHA256) |set\((MA|RTMIDI)_VERSION' CMakeLists.txt musil/cmake/fltk.cmake | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: deps
          key: deps-macos-${{ steps.v.outputs.deps }}
      - name: Build
        run: |
          cmake -B build $VERSION_ARG
          cmake --build build -j4
          cmake --build build --target dist
      - name: Render every patch
        run: tools/test-patches.sh build/Moritz.app/Contents/MacOS/moritz
      - name: Test Musil
        run: |
          tools/check-musil.sh
          tools/test-musil.sh musil build/musil/musil
          tools/test-musil.sh moritz build/Moritz.app/Contents/MacOS/moritz
          ctest --test-dir build -R '^embed$' --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/Moritz-*-macos-universal.zip

  linux:
    runs-on: ubuntu-22.04          # an older glibc runs on more distributions
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl xvfb libasound2-dev libx11-dev \
            libxext-dev libxft-dev libxinerama-dev libxcursor-dev libxrender-dev libxfixes-dev \
            libfontconfig1-dev
      - name: Version and cache key
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSION_ARG=-DMORITZ_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi
          echo "deps=$(grep -E 'FLTK_(VERSION|SHA256) |set\((MA|RTMIDI)_VERSION' CMakeLists.txt musil/cmake/fltk.cmake | sha1sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: deps
          key: deps-linux-${{ steps.v.outputs.deps }}
      - name: Build
        run: |
          cmake -B build $VERSION_ARG
          cmake --build build -j4
          cmake --build build --target dist
      - name: Render every patch
        run: xvfb-run -a tools/test-patches.sh build/Moritz/moritz build/Moritz
      - name: Test Musil
        run: |
          tools/check-musil.sh
          xvfb-run -a tools/test-musil.sh musil build/Moritz/musil/musil
          xvfb-run -a tools/test-musil.sh moritz build/Moritz/moritz
          ctest --test-dir build -R '^embed$' --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/Moritz-*-linux-x86_64.tar.gz

  windows:                         # built on Windows itself, as a user would (MSYS2)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: make curl zip diffutils mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake
      - name: Version and cache key
        id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSION_ARG=-DMORITZ_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi
          echo "deps=$(grep -E 'FLTK_(VERSION|SHA256) |set\((MA|RTMIDI)_VERSION' CMakeLists.txt musil/cmake/fltk.cmake | sha1sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: deps
          key: deps-windows-${{ steps.v.outputs.deps }}
      - name: Build
        run: |
          cmake -G "MSYS Makefiles" -B build $VERSION_ARG
          cmake --build build -j4
          cmake --build build --target dist
      - name: Render every patch
        run: |
          build/Moritz/moritz.exe --version
          tools/test-patches.sh build/Moritz/moritz.exe build/Moritz
      - name: Test Musil
        run: |
          mkdir -p /c/tmp /d/tmp     # /tmp is on the drive of the working directory
          tools/check-musil.sh
          tools/test-musil.sh musil build/Moritz/musil/musil.exe
          tools/test-musil.sh moritz build/Moritz/moritz.exe
          ctest --test-dir build -R '^embed$' --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/Moritz-*-windows-x86_64.zip

  sanitizers:                      # memory errors (ASan + UBSan) and data races (TSan), on Linux
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl xvfb libasound2-dev libx11-dev \
            libxext-dev libxft-dev libxinerama-dev libxcursor-dev libxrender-dev libxfixes-dev \
            libfontconfig1-dev
      - uses: actions/cache@v4
        with:
          path: deps
          key: deps-linux-sanitize-${{ hashFiles('CMakeLists.txt', 'musil/cmake/fltk.cmake') }}
      - name: Build
        run: |
          cmake -B build -DMORITZ_SANITIZE=${{ matrix.sanitizer }} -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build -j4
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: xvfb-run -a ctest --test-dir build -j2 --output-on-failure -E '^(perf-|example-)'

  musil-alone:                     # Musil built from musil/ alone, with and without FLTK
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      matrix:
        fltk: [ON, OFF]
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake xvfb libasound2-dev libx11-dev libxext-dev \
            libxft-dev libxinerama-dev libxcursor-dev libxrender-dev libxfixes-dev libfontconfig1-dev
      - name: Build and test
        run: |
          cmake -S musil -B build-musil -DMUSIL_FLTK=${{ matrix.fltk }}
          cmake --build build-musil -j4
          xvfb-run -a ctest --test-dir build-musil -j2 --output-on-failure
      - name: The committed help and grammar are current
        if: matrix.fltk == 'ON'
        run: |
          python3 musil/tools/gendoc.py
          python3 tools/musil-help.py
          git diff --exit-code -- musil/src/help.txt help/musil/help.txt musil/editors

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux, windows, sanitizers, musil-alone]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "Moritz ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
