# Builds Moritz on macOS, Linux and Windows (each on its own system, with the
# same make targets a user runs), renders every patch on each system
# (tools/test-patches.sh), and keeps the downloads as artifacts.
# Pushing a tag v<version> also publishes them as a GitHub release.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Version and cache key
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "MAKEFLAGS=VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi
          echo "deps=$(grep -E '^(FLTK|MA|RTMIDI)_VER' Makefile | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: deps
          key: deps-macos-${{ steps.v.outputs.deps }}
      - name: Build
        run: make -j4 && make dist
      - name: Render every patch
        run: tools/test-patches.sh ./moritz
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/Moritz-*-macos-universal.zip

  linux:
    runs-on: ubuntu-22.04          # an older glibc runs on more distributions
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl xvfb libasound2-dev libx11-dev \
            libxext-dev libxft-dev libxinerama-dev libxcursor-dev libxrender-dev libxfixes-dev \
            libfontconfig1-dev
      - name: Version and cache key
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "MAKEFLAGS=VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi
          echo "deps=$(grep -E '^(FLTK|MA|RTMIDI)_VER' Makefile | sha1sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: deps
          key: deps-linux-${{ steps.v.outputs.deps }}
      - name: Build
        run: make -j4 linux-dist
      - name: Render every patch
        run: xvfb-run -a tools/test-patches.sh build/linux/Moritz/moritz build/linux/Moritz
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/Moritz-*-linux-x86_64.tar.gz

  windows:                         # built on Windows itself, as a user would (MSYS2)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: make curl zip mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake
      - name: Version and cache key
        id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "MAKEFLAGS=VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi
          echo "deps=$(grep -E '^(FLTK|MA|RTMIDI)_VER' Makefile | sha1sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: deps
          key: deps-windows-${{ steps.v.outputs.deps }}
      - name: Build
        run: make -j4 && make windows-zip
      - name: Render every patch
        run: |
          build/windows/Moritz/moritz.exe --version
          tools/test-patches.sh build/windows/Moritz/moritz.exe build/windows/Moritz
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/Moritz-*-windows-x86_64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "Moritz ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
